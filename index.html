
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff35b8">
  <title>TV Time Capsule 📺</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="hero">
    <p class="eyebrow">✦ YOUR THROWBACK TV GUIDE ✦</p>
    <h1>TV Time <span>Capsule!</span></h1>
    <p>Find your next comfort show. From nostalgic favorites to
       new obsessions, your next binge starts here.</p>
    <div class="sticker">ON AIR ★</div>
  </header>

  <main>
    <section class="search-panel">
      <label for="search-input">What show are you looking for?</label>
      <form id="search-form">
        <input id="search-input" type="search"
          placeholder="Try Gilmore Girls or Wednesday..."
          maxlength="100" required>
        <button type="submit">Find shows ✨</button>
      </form>

      <div class="filters">
        <label for="genre-filter">Filter by genre</label>
        <select id="genre-filter">
          <option value="all">All genres</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Romance">Romance</option>
          <option value="Science-Fiction">Sci-Fi</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Mystery">Mystery</option>
          <option value="Family">Family</option>
          <option value="Adventure">Adventure</option>
        </select>
        <button type="button" id="random-button" class="secondary">
          Surprise me 🎲
        </button>
        <button type="button" id="favorites-button" class="secondary">
          ♥ Favorites
        </button>
      </div>
      <p id="status" role="status" aria-live="polite">
        Search for a show to get started!
      </p>
    </section>

    <section class="results-section">
      <div class="section-heading">
        <h2 id="results-heading">Your watchlist universe</h2>
        <span id="result-count"></span>
      </div>
      <div id="results" class="show-grid"></div>
    </section>
  </main>

  <footer>
    ✿ MADE WITH GLITTER, TELEVISION & NOSTALGIA ✿
    <p>Show data provided by TVmaze.</p>
  </footer>
</body>
</html>
